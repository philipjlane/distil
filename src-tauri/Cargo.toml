[package]
name = "distil"
version = "0.1.0"
description = "Local-first meeting notes for macOS"
authors = ["Philip Lane"]
edition = "2021"

[lib]
name = "distil_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
